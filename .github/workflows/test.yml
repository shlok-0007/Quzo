name: Test Quzo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quzo_test
          POSTGRES_USER: quzo_test
          POSTGRES_PASSWORD: quzo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QUZO_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://quzo_test:quzo_test@localhost:5432/quzo_test' || '' }}
